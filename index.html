<!DOCTYPE html>
<html lang="ko" style="height: 100%;">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="AI 챗봇 - Copilot Studio">
  <title>Copilot AI Assistant</title>
  
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html, body {
      height: 100%;
      width: 100%;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Roboto', 'Oxygen', 'Ubuntu', 'Cantarell', sans-serif;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      overflow: hidden;
    }

    body {
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 0;
    }

    .container {
      width: 100%;
      height: 100%;
      max-width: 1200px;
      display: flex;
      flex-direction: column;
      background: white;
      box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
      border-radius: 20px;
      overflow: hidden;
      animation: slideIn 0.6s ease-out;
    }

    @keyframes slideIn {
      from {
        opacity: 0;
        transform: translateY(20px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    .header {
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      color: white;
      padding: 20px 30px;
      font-size: 24px;
      font-weight: 600;
      display: flex;
      align-items: center;
      gap: 12px;
      box-shadow: 0 2px 10px rgba(102, 126, 234, 0.3);
    }

    .header::before {
      content: "🤖";
      font-size: 28px;
      display: inline-block;
    }

    .content {
      flex: 1;
      overflow: hidden;
      display: flex;
      flex-direction: column;
    }

    iframe {
      flex: 1;
      width: 100%;
      height: 100%;
      border: none;
      display: block;
    }

    .footer {
      background: #f8f9fa;
      border-top: 1px solid #e0e0e0;
      padding: 12px 20px;
      font-size: 12px;
      color: #666;
      text-align: center;
      font-weight: 500;
    }

    /* 반응형 디자인 */
    @media (max-width: 768px) {
      .container {
        border-radius: 0;
        max-width: 100%;
        height: 100vh;
      }

      .header {
        padding: 16px 20px;
        font-size: 20px;
      }
    }

    /* 스크롤바 커스터마이징 */
    ::-webkit-scrollbar {
      width: 8px;
      height: 8px;
    }

    ::-webkit-scrollbar-track {
      background: #f1f1f1;
    }

    ::-webkit-scrollbar-thumb {
      background: #667eea;
      border-radius: 4px;
    }

    ::-webkit-scrollbar-thumb:hover {
      background: #764ba2;
    }
  </style>
</head>

<body>
  <div class="container">
    <div class="header">
      Copilot AI Assistant
    </div>
    
    <div class="content">
      <iframe 
        src="https://copilotstudio.microsoft.com/environments/9324e73a-cd4e-e049-b7ba-177af6165e9c/bots/crbf2_multimodelaiagent_RSondh/webchat?__version__=2&enableFileAttachment=false&cliAgent=true" 
        allow="microphone; camera"
        loading="lazy"
        title="Copilot AI Chat">
      </iframe>
    </div>

    <div class="footer">
      © 2026 AI Assistant | Powered by Copilot Studio
    </div>
  </div>
</body>
</html>
